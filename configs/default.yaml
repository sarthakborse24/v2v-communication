# V2X Gateway Simulator — Default Configuration
# Validated against src/common/config_schema.py (Pydantic V2XSimConfig)
# Edit this file to customise simulation parameters.
# See configs/highway_scenario.yaml and configs/intersection_scenario.yaml for examples.

scenario: highway
num_dsrc_vehicles: 5
num_cv2x_vehicles: 5

# ─── DSRC Stack (IEEE 802.11p / 1609.x) ─────────────────────────────────────
dsrc:
  channel: 178            # CCH (Control Channel) — 5.890 GHz
  tx_power_dbm: 20.0      # 20 dBm = 100 mW (typical OBU power)
  mcs_index: 3            # QPSK-1/2 → 6 Mbps @ 10 MHz (robust choice for safety)
  sync_interval_ms: 100   # IEEE 1609.4 §6.3: 100 ms total (50 CCH + 50 SCH)
  cch_interval_ms: 50
  guard_interval_ms: 4.0
  antenna_gain_dbi: 0.0
  noise_figure_db: 7.0

# ─── LTE-C-V2X Stack (3GPP R14 PC5) ─────────────────────────────────────────
cv2x:
  num_subchannels: 4      # Resource pool sub-channels
  subchannel_prbs: 10     # PRBs per sub-channel
  sensing_window_ms: 100  # Mode 4 sensing window (TS 36.213 §14)
  mcs_index: 10           # 16-QAM-1/2 (moderate rate)
  tx_power_dbm: 23.0      # 23 dBm = 200 mW (3GPP typical UE power)
  antenna_gain_dbi: 0.0
  noise_figure_db: 7.0

# ─── IEEE 1609.2 Security ────────────────────────────────────────────────────
security:
  signature_algorithm: ecdsa-p256       # Mandatory US WAVE algorithm
  replay_window_ms: 1000                # ±1 s (tighter than standard ±20 min; see deviations.md)
  dedup_window_seconds: 2.0
  pseudonym_pool_size: 20
  pseudonym_rotation_interval_s: 300.0  # Rotate pseudonym every 5 minutes
  enable_revocation_check: false        # STUB — not implemented
  enable_misbehavior_detection: false   # STUB — not implemented

# ─── Channel Model ───────────────────────────────────────────────────────────
channel:
  model: winner_plus        # WINNER+ V2V highway path loss model (3GPP TR 36.885)
  environment: highway
  enable_fading: true       # Rayleigh fast fading
  enable_interference: true # Co-channel SINR model
  carrier_frequency_hz: 5.9e9
  temperature_kelvin: 293.15

# ─── Simulation Engine ───────────────────────────────────────────────────────
simulation:
  duration_seconds: 30.0
  seed: 42
  bsm_rate_hz: 10.0        # 10 Hz per SAE J2735 / IEEE 1609.2 periodic safety message rate
  real_time: false

# ─── Gateway ─────────────────────────────────────────────────────────────────
gateway:
  enable_dsrc_to_cv2x: true
  enable_cv2x_to_dsrc: true
  max_gateway_latency_ms: 5.0
  log_every_message: true

# ─── Output ──────────────────────────────────────────────────────────────────
results_dir: results
log_level: INFO

