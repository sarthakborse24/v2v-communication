[pytest]
pythonpath = src
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::pyparsing.PyparsingDeprecationWarning
addopts =
    --tb=short
    --strict-markers
    -q
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (multi-module)
    simulation: Simulation scenario tests (slow)
    security: Security-layer tests
    dsrc: DSRC-stack tests
    cv2x: C-V2X-stack tests
    gateway: Gateway-module tests

